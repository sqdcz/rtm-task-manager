[package]
name = "rtm"
version = "1.0.0"
edition = "2021"
description = "Rust Task Manager - a fast, native Win32 task manager"

[lib]
name = "rtm_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
